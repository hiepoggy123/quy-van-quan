name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets for Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp quy-van-*.js android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp icon-192.png android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/
          echo "Web assets successfully copied into Android assets directory."

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuyVanQuan.apk
          ls -lh QuyVanQuan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuyVanQuan-APK
          path: QuyVanQuan.apk
          retention-days: 30

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Quy Vân Quán APK - Phiên bản mới nhất"
          body: |
            ### 🏮 Quy Vân Quán — Game Học Tiếng Trung (Pinyin & Nghĩa Việt)
            - **Thông báo nhắc nhở**: Tự động nhắc nhở mỗi 4 giờ một lần (trong khung giờ 7:00 - 21:00).
            - **Học theo file .txt**: Tải truyện hoặc tài liệu tiếng Trung lên để tự động lọc ra bộ từ xuất hiện nhiều nhất.
            - **Lộ trình tinh chỉnh**: Luôn hiển thị Pinyin và nghĩa tiếng Việt, không bị hỏi đố các câu chưa học.
            - **Phát âm chuẩn**: Tích hợp giọng đọc tiếng Trung Bắc Kinh rõ ràng.
          files: QuyVanQuan.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
